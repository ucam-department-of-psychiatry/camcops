---
# yamllint disable rule:line-length
name: Release
# yamllint disable-line rule:truthy
on:
    push:
        tags:
            - '*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
            - name: Work out tag
              id: vars
              run: echo ::set-output name=tag::${GITHUB_REF#refs/*/}
            - name: Create DEB and RPM packages
              run: |
                set -euo pipefail
                ${GITHUB_WORKSPACE}/.github/scripts/python_setup.sh
                ${GITHUB_WORKSPACE}/.github/scripts/build_packages.sh
            - name: Create release with artifacts
              uses: ncipollo/release-action@v1
              with:
                  artifacts: "server/installer/installer_boot.py,server/packagebuild/*.deb,server/packagebuild/*.rpm"
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: Test installer
              run: |
                set -euo pipefail
                source ${GITHUB_WORKSPACE}/.github/scripts/set_camcops_docker_environment
                ${GITHUB_WORKSPACE}/.github/scripts/installer_setup.sh
                cd ${HOME}
                curl -L --retry 10 --fail https://github.com/ucam-department-of-psychiatry/camcops/releases/download/${{ steps.vars.outputs.tag }}/installer_boot.py --output installer_boot.py
                chmod u+x installer_boot.py
                python3 installer_boot.py --camcops_root_dir /camcops --version ${{ steps.vars.outputs.tag }}
                export CAMCOPS_HOME=/camcops/src
                ${GITHUB_WORKSPACE}/.github/scripts/post_installation_checks.sh
