---
# yamllint disable rule:line-length
name: Python package checks
# yamllint disable-line rule:truthy
on:
    push:
        paths:
            - '**.py'
            - .github/scripts/python_setup.sh
            - .github/workflows/python-package-checks.yml
            - pyproject.toml

jobs:
    python-package-checks:
        strategy:
            matrix:
                python-version: ["3.10", 3.11, 3.12]
                # LTS versions
                os: [ubuntu-22.04]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Python package checks
              run: |
                  set -euxo pipefail
                  ${GITHUB_WORKSPACE}/.github/scripts/python_setup.sh
                  source ${HOME}/venv/bin/activate
                  echo checking packages for conflicts
                  python -m pip check
                  echo installing vulnerability checker
                  # safety check is unsupported beyond June 2024 and is replaced with a paid service
                  # Marshmallow 4.0.0 gives error "post_dump() got an unexpected keyword argument 'pass_many'"
                  # typer pinned to avoid AttributeError: module 'typer' has no attribute 'rich_utils'
                  python -m pip install safety "marshmallow<4.0.0" typer==0.16.1
                  echo checking packages for vulnerabilities
                  # All of these vulnerabilities look either harmless or very low risk
                  # SFTY-20260721-58460 setuptools. CVE-2026-59890. Fixed in 83.0.0. Relevant to macOS APFS
                  #                     and HFS+ filesystems. We can't upgrade until Pyramid removes its
                  #                     dependency on pkg_resources (https://github.com/Pylons/pyramid/issues/3731).
                  #                     Nearly complete as of 2026-08-28.
                  safety check --full-report --ignore=SFTY-20260721-58460
